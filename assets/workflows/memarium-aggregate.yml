# Auto-generated by `memarium workflow init`. Edit freely once committed.
#
# Purpose: aggregate every device branch's typed memory into main. The LLM work
# (writing typed memory + entities + qa) happens LOCALLY on each device via the
# in-session `/memarium` skill; `memarium sync` pushes raw_sessions. This
# workflow never calls an LLM — it just does a deterministic merge so `main`
# shows a unified view (raw_sessions + memory + entities + qa) across all your
# devices.
#
# Triggers on push to ANY branch except main. The script is bundled in
# this repo at scripts/merge-books.mjs (written by `memarium workflow init`).

name: memarium aggregate memory

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write       # push merged memory to main

concurrency:
  group: memarium-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (orphan if missing)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
        continue-on-error: true

      - name: Ensure main branch exists
        run: |
          if ! git rev-parse --verify main >/dev/null 2>&1; then
            git checkout --orphan main
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "memarium: initialize main branch"
          else
            git checkout main
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        run: |
          git config user.name  "memarium-bot"
          git config user.email "memarium-bot@users.noreply.github.com"

      - name: Aggregate device memory into main
        run: node scripts/merge-books.mjs

      - name: Push main
        run: git push origin HEAD:main
